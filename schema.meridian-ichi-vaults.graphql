# - - - Timelocked-Module Events - - -
#
# Emitted by libs/timelocked.move on every timelocked-parameter proposal /
# execution. T is always u64 in this package (all six timelocked vault
# parameters are u64). vault_address is best-effort — the timelocked module
# itself does not carry the vault address; the handler may attempt
# attribution via ctx.transaction or leave it null.

"""Emitted by schedule_value_update / schedule_delay_update."""
type MIVTimelockedUpdateProposedEvent @entity {
  id: ID!
  transaction_version: BigInt!
  event_index: Int!
  timestamp: BigInt!
  vault_address: String @index
  # Tag identifies which vault parameter is being updated
  # (e.g. "deposit_hysteresis_ticks", "withdraw_fee_bps", "rebalance_cooldown").
  tag: String! @index
  current_value: BigInt!
  # Set when proposing a value update; null when proposing a delay update.
  proposed_value: BigInt
  current_delay: BigInt!
  # Set when proposing a delay update; null when proposing a value update.
  proposed_delay: BigInt
  execution_time: BigInt!
}

"""Emitted by execute_update once the timelock has elapsed."""
type MIVTimelockedUpdateExecutedEvent @entity {
  id: ID!
  transaction_version: BigInt!
  event_index: Int!
  timestamp: BigInt!
  vault_address: String @index
  tag: String! @index
  previous_value: BigInt!
  new_value: BigInt!
  delay: BigInt!
}
